<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse · 全能智能助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --border: #334155;
    --user-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
    --assistant-bg: #1e293b;
    --success: #22c55e;
    --warning: #f59e0b;
  }
  * { margin:0; padding:0; box-sizing:border-box }
  body {
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* —— Header —— */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header .brand { display:flex; align-items:center; gap:10px; }
  .header .brand h1 { font-size:17px; font-weight:600; background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .header .brand span { font-size:11px; color:var(--text2); background:var(--surface2); padding:2px 8px; border-radius:10px; }
  .header .tools { display:flex; gap:10px; align-items:center; }
  .header .tools select, .header .tools button {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; outline: none;
  }
  .header .tools select:hover, .header .tools button:hover { border-color: var(--accent); }
  .header .tools .search-toggle { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; user-select:none; }
  .header .tools .search-toggle input { display:none; }
  .header .tools .search-toggle .slider {
    width: 32px; height: 18px; background: var(--border); border-radius: 9px; position:relative; transition: .2s;
  }
  .header .tools .search-toggle .slider::after {
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; background:var(--text); border-radius:50%; transition:.2s;
  }
  .header .tools .search-toggle input:checked + .slider { background: var(--accent); }
  .header .tools .search-toggle input:checked + .slider::after { transform:translateX(14px); }
  .header .links a { color:var(--text2); font-size:12px; margin-left:12px; text-decoration:none; transition:.2s; }
  .header .links a:hover { color:var(--text); }

  /* —— Session Bar —— */
  .session-bar {
    display:flex; gap:8px; padding:8px 20px; background:var(--bg); border-bottom:1px solid var(--border); align-items:center; flex-shrink:0;
  }
  .session-bar input {
    flex:1; padding:6px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:12px; outline:none;
  }
  .session-bar input:focus { border-color: var(--accent); }
  .session-bar button {
    padding:6px 14px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap; transition:.2s;
  }
  .session-bar button:hover { border-color: var(--accent); }

  /* —— Chat —— */
  .chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
  .chat-area::-webkit-scrollbar { width:6px; }
  .chat-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  /* Welcome */
  .welcome { text-align:center; padding:40px 20px; }
  .welcome .logo { font-size:56px; margin-bottom:16px; }
  .welcome h2 { font-size:22px; margin-bottom:8px; background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .welcome p { color:var(--text2); font-size:14px; margin-bottom:24px; line-height:1.6; }
  .welcome .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:500px; margin:0 auto; }
  .welcome .chip {
    padding:8px 16px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; color:var(--text2); font-size:13px; cursor:pointer; transition:.2s;
  }
  .welcome .chip:hover { border-color:var(--accent); color:var(--text); background:var(--surface); }

  /* Messages */
  .msg { display:flex; gap:10px; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { flex-direction:row-reverse; }
  .msg .avatar { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0; }
  .msg.user .avatar { background:var(--accent);color:#fff; }
  .msg.assistant .avatar { background:var(--surface2);color:var(--accent); }
  .msg .bubble {
    max-width:78%; padding:12px 16px; border-radius:14px; font-size:14px; line-height:1.7; word-break:break-word;
  }
  .msg.user .bubble { background:var(--user-bg); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant .bubble { background:var(--assistant-bg); color:var(--text); border-bottom-left-radius:4px; }
  .msg .bubble p { margin:6px 0; }
  .msg .bubble p:first-child { margin-top:0; }
  .msg .bubble p:last-child { margin-bottom:0; }
  .msg .bubble code { background:#0f172a; padding:1px 5px; border-radius:3px; font-size:13px; }
  .msg .bubble pre { background:#0f172a; padding:12px; border-radius:8px; overflow-x:auto; margin:8px 0; font-size:12px; }
  .msg .bubble pre code { background:none; padding:0; }
  .msg .bubble a { color:#818cf8; }
  .msg .bubble ol, .msg .bubble ul { margin:6px 0 6px 20px; }
  .msg .meta { font-size:11px; color:var(--text2); margin-top:4px; padding:0 4px; display:flex; gap:8px; }
  .msg.user .meta { justify-content:flex-end; }
  .msg .meta .intent-tag { background:var(--surface2); padding:1px 8px; border-radius:10px; font-size:10px; }

  /* Typing */
  .typing { display:flex; gap:6px; padding:8px 0; }
  .typing span { width:7px;height:7px;background:var(--text2);border-radius:50%;animation:typing 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay:.2s; }
  .typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes typing { 0%,60%,100%{opacity:.3} 30%{opacity:1} }

  /* Input */
  .input-area { padding:12px 20px; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:10px; flex-shrink:0; }
  .input-area textarea {
    flex:1; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; resize:none; rows:1; max-height:100px; outline:none; transition:.2s;
  }
  .input-area textarea:focus { border-color:var(--accent); }
  .input-area button {
    padding:10px 22px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .input-area button:hover { opacity:.9; transform:translateY(-1px); }
  .input-area button:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* Tools / Sources */
  .msg .tool-line { font-size:12px; color:var(--text2); margin:2px 0 6px; display:flex; flex-wrap:wrap; gap:6px; }
  .msg .tool-chip { background:var(--surface2); border:1px solid var(--border); padding:1px 8px; border-radius:10px; }
  .msg .tool-chip.done { border-color:var(--success); }
  .msg .sources { margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:12px; color:var(--text2); }
  .msg .sources div { margin:2px 0; }
  .msg .sources a { color:#818cf8; }

  /* Login */
  .login-mask { position:fixed; inset:0; background:rgba(5,5,15,.75); display:none; align-items:center; justify-content:center; z-index:20; }
  .login-mask.show { display:flex; }
  .login-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; width:320px; display:flex; flex-direction:column; gap:12px; }
  .login-box h3 { font-size:16px; margin-bottom:4px; }
  .login-box input { padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; outline:none; }
  .login-box input:focus { border-color:var(--accent); }
  .login-box button { padding:9px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
  .login-box .err { color:#f87171; font-size:12px; min-height:16px; }

  /* Toast */
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); padding:8px 20px; border-radius:20px; font-size:12px; color:var(--text2); z-index:10; animation:toastIn .3s ease; pointer-events:none; }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(12px)} }

  /* Responsive */
  @media (max-width:640px) {
    .header { padding:0 12px; }
    .header .brand h1 { font-size:15px; }
    .header .tools { gap:6px; }
    .session-bar { padding:8px 12px; }
    .chat-area { padding:12px; }
    .input-area { padding:10px 12px; }
    .msg .bubble { max-width:88%; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand">
    <h1>🧠 Synapse</h1>
    <span id="modelBadge">loading…</span>
  </div>
  <div class="tools">
    <label class="search-toggle" title="开启后，知识问答会联网搜索最新信息">
      <input type="checkbox" id="searchToggle" checked onchange="toggleSearch()">
      <div class="slider"></div>
      <span>🌐 联网</span>
    </label>
    <select id="modelSelect" onchange="switchModel(this.value)" title="切换 LLM 模型">
      <option value="">默认模型</option>
    </select>
    <div class="links">
      <a href="/docs" target="_blank">API</a>
      <a href="/health" target="_blank">健康</a>
      <a href="/metrics" target="_blank">指标</a>
      <a href="#" id="logoutLink" style="display:none" onclick="logout();return false;">退出</a>
    </div>
  </div>
</div>

<!-- Login -->
<div class="login-mask" id="loginMask">
  <div class="login-box">
    <h3>登录 Synapse</h3>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button onclick="login()">登录</button>
  </div>
</div>

<!-- Session -->
<div class="session-bar">
  <input id="sessionId" value="demo-001" placeholder="会话 ID（同 ID 共享记忆）">
  <button onclick="newSession()" title="生成随机新会话 ID">🆕 新会话</button>
  <button onclick="clearChat()" title="仅清空聊天记录，记忆保留">🧹 清屏</button>
</div>

<!-- Chat -->
<div class="chat-area" id="chatArea">
  <div class="welcome">
    <div class="logo">🧠</div>
    <h2>你好，我是 Synapse</h2>
    <p>基于多 Agent 的全能智能助手<br>知识库问答 · 记忆检索 · 网页抓取 · 代码仓库 · 定时任务 · 插件扩展</p>
    <div class="chips">
      <div class="chip" onclick="quickAsk('什么是向量数据库？它和传统数据库有什么区别？')">🔍 什么是向量数据库？</div>
      <div class="chip" onclick="quickAsk('最近有哪些重要的 AI 新闻？')">🌐 最近 AI 新闻</div>
      <div class="chip" onclick="quickAsk('帮我总结一下这个网页：https://www.python.org/about/')">🔗 总结网页</div>
      <div class="chip" onclick="quickAsk('我上次问你的问题是什么？')">🧠 回忆对话</div>
      <div class="chip" onclick="quickAsk('列出我连接的代码仓库，并看看最近的提交')">📦 仓库提交</div>
      <div class="chip" onclick="quickAsk('每天早上 9 点帮我总结 AI 新闻')">⏰ 定时任务</div>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <textarea id="msgInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行…" rows="1"></textarea>
  <button id="sendBtn" onclick="send()">➤ 发送</button>
</div>

<script>
// ==================== State ====================
const api = '/chat';
const streamApi = '/chat/stream';
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const modelBadge = document.getElementById('modelBadge');
const modelSelect = document.getElementById('modelSelect');
const searchToggle = document.getElementById('searchToggle');
let empty = true;
let webSearchEnabled = true;
// 普通用户无权切换全局模型时，选择的模型只作用于自己的请求
let requestModel = '';
let authEnabled = false;
let authToken = localStorage.getItem('synapse_token') || '';

// ==================== Auth ====================
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

async function authFetch(url, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = authHeaders(opts.headers);
  const res = await fetch(url, opts);
  if (res.status === 401 && authEnabled) { showLogin(); }
  return res;
}

function showLogin() { document.getElementById('loginMask').classList.add('show'); document.getElementById('loginUser').focus(); }
function hideLogin() { document.getElementById('loginMask').classList.remove('show'); }

async function login() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || '登录失败'; return; }
    authToken = data.access_token;
    localStorage.setItem('synapse_token', authToken);
    hideLogin();
    document.getElementById('logoutLink').style.display = '';
    showToast(`欢迎，${data.user.username}`);
    loadModels();
  } catch (e) { err.textContent = '无法连接服务器'; }
}

function logout() {
  authToken = '';
  localStorage.removeItem('synapse_token');
  document.getElementById('logoutLink').style.display = 'none';
  showLogin();
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ==================== Init ====================
(async function init() {
  try {
    const res = await fetch('/auth/config');
    authEnabled = (await res.json()).auth_enabled;
  } catch (e) { authEnabled = false; }
  if (authEnabled) {
    if (!authToken) { showLogin(); }
    else { document.getElementById('logoutLink').style.display = ''; }
  }
  loadModels();
})();

async function loadModels() {
  try {
    const res = await authFetch('/models');
    if (!res.ok) { modelBadge.textContent = authEnabled ? '未登录' : '未连接'; return; }
    const cfg = await res.json();
    modelBadge.textContent = `${cfg.provider} / ${cfg.model}`;
    modelBadge.title = `base_url: ${cfg.base_url}\nembedding key: ${cfg.embedding_api_key_set ? '已配' : '未配'}`;
    if (!cfg.embedding_api_key_set && cfg.provider === 'deepseek') {
      modelBadge.title += '\n⚠️ DeepSeek 不支持 embedding，长期记忆/知识检索依赖本地 ONNX';
    }
    // 填充模型选择器
    if (modelSelect.options.length <= 1) {
      const models = ['deepseek-chat', 'deepseek-reasoner', 'gpt-4o-mini', 'gpt-4o', 'gpt-3.5-turbo', 'claude-3-5-sonnet-20241022', 'claude-3-haiku-20240307'];
      models.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; modelSelect.appendChild(o); });
    }
  } catch(e) { modelBadge.textContent = '未连接'; }
}

// ==================== Search Toggle ====================
function toggleSearch() { webSearchEnabled = searchToggle.checked; }

// ==================== Model Switch ====================
async function switchModel(model) {
  if (!model) { requestModel = ''; loadModels(); return; }
  try {
    const res = await authFetch('/models/switch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model})
    });
    if (res.status === 403) {
      // 非管理员：不修改全局配置，只对自己的请求生效
      requestModel = model;
      modelBadge.textContent = `${model}（仅本人）`;
      showToast(`本人请求将使用 ${model}`);
      return;
    }
    const cfg = await res.json();
    requestModel = '';
    modelBadge.textContent = `${cfg.provider} / ${cfg.model}`;
    showToast(`已切换至 ${cfg.model}`);
  } catch(e) { showToast('切换失败'); }
}

// ==================== Session ====================
function getSessionId() { return document.getElementById('sessionId').value.trim() || 'default'; }
function newSession() { document.getElementById('sessionId').value = 'sess-' + Date.now().toString(36); }
function clearChat() { chatArea.innerHTML = ''; empty = true; renderWelcome(); }

// ==================== Messages ====================
function addMsg(role, text, meta) {
  if (empty) { chatArea.innerHTML = ''; empty = false; }
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '🧑' : '🤖';
  const body = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text).replace(/\n/g,'<br>');
  const metaHtml = meta ? `<div class="meta">${meta.map(m => `<span class="intent-tag">${m}</span>`).join('')}</div>` : '';
  div.innerHTML = `<div class="avatar">${avatar}</div><div><div class="tool-line"></div><div class="bubble">${body}</div>${metaHtml}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function setMeta(div, meta) {
  const holder = div.querySelector(':scope > div');
  let el = holder.querySelector('.meta');
  if (!el) { el = document.createElement('div'); el.className = 'meta'; holder.appendChild(el); }
  el.innerHTML = meta.map(m => `<span class="intent-tag">${escapeHtml(String(m))}</span>`).join('');
}

function addToolChip(div, name, done) {
  const line = div.querySelector('.tool-line');
  let chip = [...line.querySelectorAll('.tool-chip')].find(c => c.dataset.name === name && !c.classList.contains('done'));
  if (!chip) {
    chip = document.createElement('span'); chip.className = 'tool-chip'; chip.dataset.name = name;
    chip.textContent = `🔧 ${name}…`; line.appendChild(chip);
  }
  if (done) { chip.classList.add('done'); chip.textContent = `✅ ${name}`; }
}

function renderSources(div, data) {
  const items = [];
  (data.sources || []).forEach(s => {
    const label = [s.kb, s.filename].filter(Boolean).join(' / ') || '知识库';
    items.push(`📄 ${escapeHtml(label)}（相似度 ${(Number(s.score || 0) * 100).toFixed(0)}%）`);
  });
  (data.web_sources || []).forEach(s => {
    items.push(`🌐 <a href="${encodeURI(s.url || '#')}" target="_blank" rel="noopener">${escapeHtml(s.title || s.url || '')}</a>`);
  });
  if (!items.length) return;
  const el = document.createElement('div'); el.className = 'sources';
  el.innerHTML = '<div>引用来源：</div>' + items.map(i => `<div>${i}</div>`).join('');
  div.querySelector('.bubble').appendChild(el);
}

function addTyping() {
  const div = document.createElement('div'); div.className = 'msg assistant'; div.id = 'typing-indicator';
  div.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatArea.appendChild(div); chatArea.scrollTop = chatArea.scrollHeight;
}
function removeTyping() { const el = document.getElementById('typing-indicator'); if(el) el.remove(); }

function renderMarkdown(text) {
  if (typeof marked === 'undefined') return escapeHtml(text).replace(/\n/g, '<br>');
  marked.setOptions({ breaks: true, gfm: true });
  try { return marked.parse(text); } catch(e) { return escapeHtml(text).replace(/\n/g,'<br>'); }
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ==================== Welcome ====================
function renderWelcome() {
  chatArea.innerHTML = `
    <div class="welcome">
      <div class="logo">🧠</div>
      <h2>你好，我是 Synapse</h2>
      <p>基于多 Agent 的全能智能助手<br>知识库问答 · 记忆检索 · 网页抓取 · 代码仓库 · 定时任务 · 插件扩展</p>
      <div class="chips">
        <div class="chip" onclick="quickAsk('什么是向量数据库？它和传统数据库有什么区别？')">🔍 什么是向量数据库？</div>
        <div class="chip" onclick="quickAsk('最近有哪些重要的 AI 新闻？')">🌐 最近 AI 新闻</div>
        <div class="chip" onclick="quickAsk('帮我总结一下这个网页：https://www.python.org/about/')">🔗 总结网页</div>
        <div class="chip" onclick="quickAsk('我上次问你的问题是什么？')">🧠 回忆对话</div>
        <div class="chip" onclick="quickAsk('列出我连接的代码仓库，并看看最近的提交')">📦 仓库提交</div>
        <div class="chip" onclick="quickAsk('每天早上 9 点帮我总结 AI 新闻')">⏰ 定时任务</div>
      </div>
    </div>`;
  empty = true;
}

// ==================== Quick Ask ====================
function quickAsk(msg) {
  document.getElementById('msgInput').value = msg;
  send();
}

// ==================== Toast ====================
function showToast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 2000);
}

// ==================== Send ====================
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
});

function resultTags(data) {
  return [`意图: ${data.intent}`, `Agent: ${data.agent_used}`, `置信: ${(data.confidence*100).toFixed(0)}%`];
}

function buildRequest(sid, msg) {
  const body = { session_id: sid, message: msg };
  if (requestModel) body.model = requestModel;
  const headers = { 'Content-Type': 'application/json', 'X-Web-Search': webSearchEnabled ? '1' : '0' };
  return { body, headers };
}

// 一次性请求（流式不可用时的回退）
async function sendOnce(sid, msg) {
  const { body, headers } = buildRequest(sid, msg);
  const res = await authFetch(api, { method:'POST', headers, body: JSON.stringify(body) });
  const data = await res.json();
  removeTyping();
  if (res.ok) {
    const div = addMsg('assistant', data.reply, resultTags(data));
    (data.tool_calls || []).forEach(t => addToolChip(div, t.name, true));
    renderSources(div, data);
  } else {
    addMsg('assistant', `❌ ${data.detail || '请求失败，请重试'}`);
  }
}

// 流式请求：解析 SSE（meta / token / tool_start / tool_end / done / error）
async function sendStream(sid, msg) {
  const { body, headers } = buildRequest(sid, msg);
  const res = await authFetch(streamApi, { method:'POST', headers, body: JSON.stringify(body) });
  if (!res.ok || !res.body) {
    if (res.status === 401) { removeTyping(); addMsg('assistant', '🔒 请先登录'); return true; }
    return false;
  }
  removeTyping();
  const div = addMsg('assistant', '');
  const bubble = div.querySelector('.bubble');
  let text = '', pending = false, finished = false;
  const render = () => {
    pending = false;
    bubble.innerHTML = renderMarkdown(text || '…');
    chatArea.scrollTop = chatArea.scrollHeight;
  };
  const handle = (type, data) => {
    if (type === 'meta') setMeta(div, [`意图: ${data.intent}`, `置信: ${(data.confidence*100).toFixed(0)}%`]);
    else if (type === 'token') { text += data.content; if (!pending) { pending = true; requestAnimationFrame(render); } }
    else if (type === 'tool_start') addToolChip(div, data.name, false);
    else if (type === 'tool_end') addToolChip(div, data.name, true);
    else if (type === 'done') {
      finished = true;
      text = data.reply || text; render();
      setMeta(div, resultTags(data));
      renderSources(div, data);
    } else if (type === 'error') { finished = true; text += `\n\n❌ ${data.message}`; render(); }
  };

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
        let type = 'message', dataLine = '';
        raw.split('\n').forEach(line => {
          if (line.startsWith('event:')) type = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
        });
        if (dataLine) { try { handle(type, JSON.parse(dataLine)); } catch (e) { /* 忽略无法解析的事件 */ } }
      }
    }
  } catch (e) {
    // 已开始输出后连接中断：保留已生成的内容并提示，不再回退重发
    text += '\n\n⚠️ 连接中断';
  }
  if (!finished) render();
  return true;
}

async function send() {
  const msg = msgInput.value.trim();
  if (!msg) return;
  if (authEnabled && !authToken) { showLogin(); return; }
  const sid = getSessionId();
  if (empty) { chatArea.innerHTML = ''; empty = false; }
  addMsg('user', msg);
  msgInput.value = ''; msgInput.style.height = 'auto';
  sendBtn.disabled = true; sendBtn.textContent = '…';
  addTyping();

  try {
    let ok = false;
    try { ok = await sendStream(sid, msg); } catch (e) { ok = false; }
    if (!ok) await sendOnce(sid, msg);
  } catch(e) {
    removeTyping();
    addMsg('assistant', '⚠️ 无法连接到服务器。请确认 docker compose up -d 已启动。\n\n终端运行：`docker compose up -d`');
  }
  sendBtn.disabled = false;
  sendBtn.textContent = '➤ 发送';
}
</script>
