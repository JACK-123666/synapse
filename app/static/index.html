<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse · 多 Agent 智能助手</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-soft: #eff6ff;
    --blue-line: #dbeafe;
    --bg: #f6f8fb;
    --surface: #ffffff;
    --line: #e5e9f0;
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --ring: 0 0 0 3px rgba(37,99,235,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .shell { display: flex; height: 100dvh; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    height: 56px; flex-shrink: 0; background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--blue);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .brand-badge {
    font-size: 11px; color: var(--blue); background: var(--blue-soft);
    border: 1px solid var(--blue-line); padding: 2px 9px; border-radius: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
  }
  .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .link {
    color: var(--muted); font-size: 12px; text-decoration: none;
    padding: 4px 2px; transition: color .15s;
  }
  .link:hover { color: var(--blue); }
  .select {
    font: inherit; font-size: 12px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
    cursor: pointer; outline: none; max-width: 165px;
  }
  .select:focus { border-color: var(--blue); box-shadow: var(--ring); }

  /* 开关 */
  .switch { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track {
    width: 34px; height: 19px; border-radius: 19px; background: #cbd5e1;
    position: relative; transition: background .18s; flex-shrink: 0;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; transition: transform .18s;
    box-shadow: 0 1px 2px rgba(15,23,42,.2);
  }
  .switch input:checked + .track { background: var(--blue); }
  .switch input:checked + .track .knob { transform: translateX(15px); }
  .switch-label { font-size: 12px; color: var(--muted); }

  /* ---------- 侧边栏：历史会话 ---------- */
  .sidebar {
    width: 262px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    transition: margin-left .22s ease;
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 15px 12px;
  }
  .side-title { font-size: 13px; font-weight: 600; }
  .side-new {
    font: inherit; font-size: 12px; color: var(--blue); background: var(--blue-soft);
    border: 1px solid var(--blue-line); border-radius: 8px; padding: 4px 11px;
    cursor: pointer; transition: all .15s;
  }
  .side-new:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .side-list { flex: 1; overflow-y: auto; padding: 0 9px 10px; }
  .side-list::-webkit-scrollbar { width: 6px; }
  .side-list::-webkit-scrollbar-thumb { background: #dfe5ee; border-radius: 3px; }
  .side-empty { font-size: 12px; color: var(--faint); padding: 16px 8px; line-height: 1.8; }
  .conv {
    padding: 8px 8px 8px 11px; border-radius: 9px; cursor: pointer; margin-bottom: 2px;
    border: 1px solid transparent; transition: background .13s, border-color .13s;
    display: flex; align-items: center; gap: 6px;
  }
  .conv:hover { background: var(--bg); }
  .conv.active { background: var(--blue-soft); border-color: var(--blue-line); }
  .conv.confirming { background: #fef2f2; border-color: #fecaca; }
  .conv-main { flex: 1; min-width: 0; }
  .conv-title {
    font-size: 12.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-bottom: 3px;
  }
  .conv.active .conv-title { color: var(--blue-dark); font-weight: 500; }
  .conv-sub { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 3px; min-height: 17px; }
  .conv-del {
    flex-shrink: 0; width: 21px; height: 21px; border-radius: 6px; border: none;
    background: transparent; color: var(--faint); font-size: 15px; line-height: 1;
    cursor: pointer; opacity: 0; transition: opacity .13s, background .13s, color .13s;
  }
  .conv:hover .conv-del { opacity: 1; }
  .conv-del:hover { background: #fee2e2; color: var(--err); }
  /* 触屏设备没有 hover，删除按钮常显 */
  @media (hover: none) { .conv-del { opacity: 1; } }
  .del-ask { color: var(--err); }
  .mini {
    font: inherit; font-size: 11px; padding: 1px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    cursor: pointer; transition: all .13s;
  }
  .mini:hover { border-color: var(--muted); color: var(--text); }
  .mini.danger { border-color: #fecaca; color: var(--err); background: #fef2f2; }
  .mini.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .side-foot { border-top: 1px solid var(--line); padding: 12px 15px 14px; }
  .side-input {
    width: 100%; font: inherit; font-size: 12px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .side-input:focus { border-color: var(--blue); box-shadow: var(--ring); background: var(--surface); }
  .prof-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .prof-title { font-size: 12px; font-weight: 600; }
  .prof-body { display: flex; flex-direction: column; gap: 6px; margin-bottom: 9px; }
  .prof-row { display: flex; gap: 7px; font-size: 11px; line-height: 1.7; }
  .prof-k { color: var(--faint); flex-shrink: 0; width: 40px; }
  .prof-v { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .prof-empty { color: var(--faint); font-size: 11px; }
  .ptag {
    display: inline-flex; align-items: center; gap: 4px; padding: 0 6px;
    background: var(--blue-soft); border: 1px solid var(--blue-line); color: var(--blue-dark);
    border-radius: 20px; font-size: 10.5px; line-height: 17px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ptag.plain { background: var(--bg); border-color: var(--line); color: var(--muted); }
  .ptag i { font-style: normal; opacity: .5; cursor: pointer; }
  .ptag i:hover { opacity: 1; color: var(--err); }
  .ptag.plain i { cursor: default; }
  .ptag.plain i:hover { color: var(--muted); }
  .prof-add { display: flex; gap: 5px; align-items: center; }
  .prof-add .side-input { flex: 1; min-width: 0; }
  .prof-id { font-size: 10px; color: var(--faint); margin-top: 8px; line-height: 1.5; word-break: break-all; }
  .side-toggle {
    display: none; font: inherit; font-size: 16px; color: var(--muted);
    background: none; border: none; cursor: pointer; padding: 0 3px;
  }
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.3); z-index: 24; display: none; }
  .scrim.show { display: block; }

  /* ---------- 聊天区 ---------- */
  .chat {
    flex: 1; overflow-y: auto; padding: 26px 20px 8px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #d7dee8; border-radius: 4px; }
  .chat::-webkit-scrollbar-thumb:hover { background: #c3cddb; }
  .chat-inner { width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* 欢迎 */
  .welcome { text-align: center; padding: 54px 20px 20px; }
  .welcome-mark {
    width: 46px; height: 46px; border-radius: 13px; background: var(--blue);
    color: #fff; font-size: 21px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 18px;
  }
  .welcome h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .welcome p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 560px; margin: 0 auto; }
  .chip {
    padding: 8px 15px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; color: var(--muted); font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }

  /* 消息 */
  .msg { display: flex; gap: 11px; animation: rise .28s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  }
  .msg.user .avatar { background: var(--blue); color: #fff; }
  .msg.assistant .avatar { background: var(--blue-soft); color: var(--blue); border: 1px solid var(--blue-line); }
  .msg-body { min-width: 0; max-width: 78%; }
  .msg.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble {
    padding: 11px 15px; border-radius: 14px; font-size: 14px;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--line);
    border-bottom-left-radius: 5px; box-shadow: var(--shadow);
  }
  .bubble > *:first-child { margin-top: 0 !important; }
  .bubble > *:last-child { margin-bottom: 0 !important; }
  .bubble p { margin: 8px 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 14px 0 7px; font-weight: 600; line-height: 1.4; }
  .bubble h1 { font-size: 17px; }
  .bubble h2 { font-size: 15.5px; }
  .bubble h3 { font-size: 14.5px; }
  .bubble h4 { font-size: 14px; }
  .bubble ul, .bubble ol { margin: 8px 0 8px 20px; }
  .bubble li { margin: 3px 0; }
  .bubble a { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue-line); }
  .bubble a:hover { border-bottom-color: var(--blue); }
  .msg.user .bubble a { color: #fff; border-bottom-color: rgba(255,255,255,.5); }
  .bubble code {
    background: var(--blue-soft); color: var(--blue-dark); padding: 1.5px 5px;
    border-radius: 4px; font-size: 12.5px;
    font-family: "SF Mono", Consolas, "Cascadia Mono", monospace;
  }
  .msg.user .bubble code { background: rgba(255,255,255,.2); color: #fff; }
  .bubble pre {
    background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 10px;
    overflow-x: auto; margin: 10px 0; font-size: 12.5px; line-height: 1.6;
  }
  .bubble pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
  .bubble blockquote {
    border-left: 3px solid var(--blue-line); padding: 2px 0 2px 12px;
    margin: 10px 0; color: var(--muted);
  }
  .bubble hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .bubble th { background: var(--blue-soft); font-weight: 600; }
  .msg.user .bubble table, .msg.user .bubble th, .msg.user .bubble td { border-color: rgba(255,255,255,.3); }
  .msg.user .bubble th { background: rgba(255,255,255,.15); }

  /* 元信息 / 工具 / 来源 */
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tag {
    font-size: 10.5px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); padding: 1.5px 8px; border-radius: 20px;
  }
  .tag.accent { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .tool-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  .tool-chip {
    font-size: 11px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); padding: 2px 9px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tool-chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
  .tool-chip.done { color: var(--ok); border-color: #a7f3d0; background: #f0fdf9; }
  .tool-chip.done::before { background: var(--ok); }
  .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
  .sources-title { font-size: 11px; color: var(--faint); margin-bottom: 4px; }
  .sources div.item { margin: 3px 0; }
  .sources a { color: var(--blue); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }

  /* 打字指示 */
  .typing { display: flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.3s infinite; }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- 输入区 ---------- */
  .composer { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 13px 20px 15px; }
  .composer-box {
    width: 100%; max-width: 820px; margin: 0 auto; display: flex; gap: 9px;
    align-items: flex-end; background: var(--bg); border: 1px solid var(--line);
    border-radius: 13px; padding: 7px 7px 7px 14px; transition: border-color .15s, box-shadow .15s;
  }
  .composer-box:focus-within { border-color: var(--blue); box-shadow: var(--ring); background: var(--surface); }
  .composer textarea {
    flex: 1; border: none; background: transparent; resize: none; outline: none;
    font: inherit; font-size: 14px; color: var(--text); line-height: 1.6;
    max-height: 132px; padding: 5px 0;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .btn-send {
    font: inherit; font-size: 13px; font-weight: 500; color: #fff; background: var(--blue);
    border: none; border-radius: 9px; padding: 9px 19px; cursor: pointer;
    transition: background .15s; flex-shrink: 0;
  }
  .btn-send:hover { background: var(--blue-dark); }
  .btn-send:disabled { background: #bfdbfe; cursor: not-allowed; }

  /* ---------- 登录 ---------- */
  .mask { position: fixed; inset: 0; background: rgba(15,23,42,.34); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .mask.show { display: flex; }
  .login-box {
    background: var(--surface); border-radius: 16px; padding: 30px 28px; width: 100%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(15,23,42,.16); display: flex; flex-direction: column; gap: 11px;
  }
  .login-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .login-box .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .login-box input {
    font: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 9px; outline: none; background: var(--bg); transition: border-color .15s, box-shadow .15s;
  }
  .login-box input:focus { border-color: var(--blue); box-shadow: var(--ring); background: var(--surface); }
  .login-box button {
    font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: var(--blue);
    border: none; border-radius: 9px; padding: 10px; cursor: pointer; margin-top: 3px; transition: background .15s;
  }
  .login-box button:hover { background: var(--blue-dark); }
  .login-box .err { color: var(--err); font-size: 12px; min-height: 17px; }

  /* ---------- Toast ---------- */
  .toaster { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 40; pointer-events: none; }
  .toast {
    background: #0f172a; color: #f8fafc; font-size: 12.5px; padding: 8px 18px;
    border-radius: 20px; box-shadow: 0 6px 20px rgba(15,23,42,.22); animation: toastIn .22s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- 响应式 ---------- */
  @media (max-width: 700px) {
    .topbar { padding: 0 13px; height: 52px; }
    .brand-badge { max-width: 110px; }
    .actions .link { display: none; }
    .select { max-width: 118px; }
    .side-toggle { display: block; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 25;
      margin-left: -262px; box-shadow: 5px 0 22px rgba(15,23,42,.1);
    }
    .sidebar.open { margin-left: 0; }
    .chat { padding: 18px 13px 8px; }
    .composer { padding: 11px 13px 13px; }
    .msg-body { max-width: 88%; }
    .welcome { padding: 34px 12px 12px; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- 侧边栏：历史会话 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span class="side-title">历史会话</span>
      <button class="side-new" id="btnNewSession" title="开始一段新对话">＋ 新建</button>
    </div>
    <div class="side-list" id="sessionList"></div>
    <div class="side-foot">
      <div class="prof-head">
        <span class="prof-title">用户画像</span>
        <button class="mini" id="btnProfileClear" title="清除全部画像">清除</button>
      </div>
      <div class="prof-body" id="profileBody"></div>
      <div class="prof-add">
        <input class="side-input" id="prefInput" placeholder="添加偏好，如「用中文回答」">
        <button class="mini" id="btnPrefAdd">加</button>
      </div>
      <div class="prof-id" id="profileId"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <button class="side-toggle" id="btnSidebar" title="历史会话">☰</button>
    <span class="brand-mark">S</span>
    <span class="brand-name">Synapse</span>
    <span class="brand-badge" id="modelBadge">连接中</span>
  </div>
  <div class="actions">
    <label class="switch" title="开启后，知识问答会联网检索最新信息">
      <input type="checkbox" id="searchToggle" checked>
      <span class="track"><span class="knob"></span></span>
      <span class="switch-label">联网</span>
    </label>
    <select class="select" id="modelSelect" title="本次请求使用的模型"></select>
    <a class="link" href="/docs" target="_blank" rel="noopener">API</a>
    <a class="link" href="/health" target="_blank" rel="noopener">健康</a>
    <a class="link" href="/metrics" target="_blank" rel="noopener">指标</a>
    <a class="link" href="#" id="logoutLink" style="display:none">退出</a>
  </div>
</header>

<!-- 聊天区 -->
<main class="chat" id="chatArea"></main>

<!-- 输入区 -->
<footer class="composer">
  <div class="composer-box">
    <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
    <button class="btn-send" id="sendBtn">发送</button>
  </div>
</footer>

  </div><!-- /.main -->
</div><!-- /.shell -->

<!-- 登录 -->
<div class="mask" id="loginMask">
  <div class="login-box">
    <h3>登录 Synapse</h3>
    <div class="sub">该部署已开启鉴权，请使用管理员分配的账号</div>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button id="btnLogin">登录</button>
  </div>
</div>

<div class="toaster" id="toaster"></div>

<script>
/* ==================== DOM ==================== */
const chatArea = document.getElementById("chatArea");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const modelBadge = document.getElementById("modelBadge");
const modelSelect = document.getElementById("modelSelect");
const searchToggle = document.getElementById("searchToggle");
const toaster = document.getElementById("toaster");
const loginMask = document.getElementById("loginMask");
const loginErr = document.getElementById("loginErr");

/* ==================== 状态 ==================== */
let inner = null;              // .chat-inner 容器
let empty = true;              // 是否处于欢迎页

/* ==================== Markdown ==================== */
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
      // 只放行 http/https/mailto 与站内相对链接，挡掉 javascript: 等危险协议
      const safe = /^(https?:|mailto:|\/|#)/i.test(url) ? url : "#";
      return `<a href="${safe}" target="_blank" rel="noopener">${text}</a>`;
    });
}

function renderTable(rows) {
  const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => renderInline(c.trim()));
  const head = cells(rows[0]);
  let out = "<table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
  for (let r = 1; r < rows.length; r++) {
    out += "<tr>" + cells(rows[r]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
  }
  return out + "</tbody></table>";
}

/* 轻量 Markdown 渲染：覆盖模型常用的标题 / 列表 / 代码块 / 表格 / 引用 / 行内样式。
   先整体转义再套用结构，避免 XSS。不依赖任何外部 CDN。 */
function renderMarkdown(src) {
  const lines = escapeHtml(src || "").split("\n");
  const out = [];
  let listType = null;
  let para = [];
  let i = 0;

  const flushPara = () => { if (para.length) { out.push(`<p>${para.join("<br>")}</p>`); para = []; } };
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);

  while (i < lines.length) {
    const line = lines[i];

    const fence = line.match(/^\s*```(\w*)\s*$/);
    if (fence) {
      flushPara(); closeList();
      const lang = fence[1];
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code${lang ? ` class="lang-${lang}"` : ""}>${buf.join("\n")}</code></pre>`);
      continue;
    }

    if (isRow(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushPara(); closeList();
      const rows = [line];
      i += 2;
      while (i < lines.length && isRow(lines[i])) { rows.push(lines[i]); i++; }
      out.push(renderTable(rows));
      continue;
    }

    const head = line.match(/^(#{1,6})\s+(.*)$/);
    if (head) {
      flushPara(); closeList();
      const lv = head[1].length;
      out.push(`<h${lv}>${renderInline(head[2])}</h${lv}>`);
      i++; continue;
    }

    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushPara(); closeList(); out.push("<hr>"); i++; continue; }

    if (/^\s*&gt;\s?/.test(line)) {
      flushPara(); closeList();
      const buf = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++; }
      out.push(`<blockquote>${renderInline(buf.join("<br>"))}</blockquote>`);
      continue;
    }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const want = ul ? "ul" : "ol";
      if (listType !== want) { closeList(); out.push(`<${want}>`); listType = want; }
      out.push(`<li>${renderInline(ul ? ul[1] : ol[1])}</li>`);
      i++; continue;
    }

    if (/^\s*$/.test(line)) { flushPara(); closeList(); i++; continue; }

    para.push(renderInline(line));
    i++;
  }
  flushPara(); closeList();
  return out.join("\n");
}

/* ==================== 鉴权 ==================== */
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (authToken) h["Authorization"] = "Bearer " + authToken;
  return h;
}

async function authFetch(url, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = authHeaders(opts.headers);
  const res = await fetch(url, opts);
  if (res.status === 401 && authEnabled) showLogin();
  return res;
}

function showLogin() { loginMask.classList.add("show"); document.getElementById("loginUser").focus(); }
function hideLogin() { loginMask.classList.remove("show"); }

async function login() {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  loginErr.textContent = "";
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { loginErr.textContent = data.detail || "登录失败"; return; }
    authToken = data.access_token;
    localStorage.setItem("synapse_token", authToken);
    hideLogin();
    document.getElementById("logoutLink").style.display = "";
    toast(`欢迎回来，${data.user.username}`);
    loadModels();
  } catch (e) { loginErr.textContent = "无法连接服务器"; }
}

function logout() {
  authToken = "";
  localStorage.removeItem("synapse_token");
  document.getElementById("logoutLink").style.display = "none";
  showLogin();
}

/* ==================== 初始化 ==================== */
(async function init() {
  try {
    const res = await fetch("/auth/config");
    authEnabled = (await res.json()).auth_enabled;
  } catch (e) { authEnabled = false; }
  if (authEnabled) {
    if (!authToken) showLogin();
    else document.getElementById("logoutLink").style.display = "";
  }
  loadSessionState();
  ensureUserId();
  if (!currentSession) currentSession = "sess-" + Date.now().toString(36);
  renderSessionList();
  loadModels();
  loadProfile();

  // 有历史就恢复最近一次会话，否则显示欢迎页
  if (sessions.some((s) => s.id === currentSession)) await selectSession(currentSession);
  else renderWelcome();

  syncServerSessions();
})();

async function loadModels() {
  try {
    const res = await authFetch("/models");
    if (!res.ok) { modelBadge.textContent = authEnabled ? "未登录" : "未连接"; return; }
    const cfg = await res.json();
    modelBadge.textContent = `${cfg.provider} / ${cfg.model}`;
    modelBadge.title = `base_url: ${cfg.base_url}\nembedding: ${cfg.embedding_api_key_set ? "API Key 已配" : "本地模型"}`;
    if (modelSelect.options.length <= 1) {
      ["deepseek-chat", "deepseek-reasoner", "gpt-4o-mini", "gpt-4o", "claude-3-5-sonnet-20241022"].forEach((m) => {
        const o = document.createElement("option"); o.value = m; o.textContent = m; modelSelect.appendChild(o);
      });
    }
  } catch (e) { modelBadge.textContent = "未连接"; }
}

async function switchModel(model) {
  if (!model) { requestModel = ""; loadModels(); return; }
  try {
    const res = await authFetch("/models/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model }),
    });
    if (res.status === 403) {
      requestModel = model;
      modelBadge.textContent = `${model}（仅本人）`;
      toast(`你的请求将使用 ${model}`);
      return;
    }
    const cfg = await res.json();
    requestModel = "";
    modelBadge.textContent = `${cfg.provider} / ${cfg.model}`;
    toast(`已切换至 ${cfg.model}`);
  } catch (e) { toast("切换失败"); }
}

/* ==================== 会话管理 ==================== */
function loadSessionState() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_SESSIONS) || "[]");
    sessions = Array.isArray(raw) ? raw.filter((s) => s && s.id) : [];
  } catch (e) { sessions = []; }
  currentSession = localStorage.getItem(LS_CURRENT) || "";
}

function saveSessionState() {
  localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions.slice(0, MAX_SESSIONS)));
  localStorage.setItem(LS_CURRENT, currentSession);
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  return d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}

function renderSessionList() {
  const box = document.getElementById("sessionList");
  if (!sessions.length) {
    box.innerHTML = `<div class="side-empty">还没有历史会话。<br>发一条消息就会出现在这里。</div>`;
    return;
  }
  box.innerHTML = sessions.map((s) => {
    const confirming = s.id === pendingDelete;
    const sub = confirming
      ? `<span class="del-ask">删除这段对话？</span>`
        + `<button class="mini danger" data-confirm="${escapeHtml(s.id)}">删除</button>`
        + `<button class="mini" data-cancel="1">取消</button>`
      : `<span>${escapeHtml(fmtTime(s.ts))}${s.hasSummary ? " · 含长期摘要" : ""}</span>`;
    return `
      <div class="conv${s.id === currentSession ? " active" : ""}${confirming ? " confirming" : ""}" data-sid="${escapeHtml(s.id)}">
        <div class="conv-main">
          <div class="conv-title">${escapeHtml(s.title || s.id)}</div>
          <div class="conv-sub">${sub}</div>
        </div>
        <button class="conv-del" data-del="${escapeHtml(s.id)}" title="删除这段对话">×</button>
      </div>`;
  }).join("");
}

/* 删除一个会话：服务端清短期记忆 + 该会话的长期摘要，本地同步移除。 */
async function deleteSession(id) {
  pendingDelete = "";
  try {
    await authFetch("/memories/sessions/" + encodeURIComponent(id) + "?purge=true", { method: "DELETE" });
  } catch (e) { /* 服务端失败也要保证本地列表一致 */ }

  sessions = sessions.filter((s) => s.id !== id);
  if (currentSession === id) {
    newSession();                       // 内部会 save + render
  } else {
    saveSessionState();
    renderSessionList();
  }
  toast("已删除该会话");
}

/* 记录/更新一个会话。title 只在还没有标题时写入，避免覆盖首条消息。 */
function touchSession(id, title) {
  let item = sessions.find((s) => s.id === id);
  if (!item) {
    item = { id, title: title || id, ts: Date.now() };
    sessions.unshift(item);
  } else {
    item.ts = Date.now();
    if (title && (!item.title || item.title === item.id)) item.title = title;
  }
  sessions.sort((a, b) => b.ts - a.ts);
  saveSessionState();
  renderSessionList();
}

/* 把服务端还留存的会话并回列表：本地记录可能被清掉，或换了个浏览器。 */
async function syncServerSessions() {
  try {
    const res = await authFetch("/memories/sessions?limit=50");
    if (!res.ok) return;
    const list = await res.json();
    let changed = false;
    for (const s of list) {
      const ts = (Number(s.updated_at) || 0) * 1000;
      const item = sessions.find((x) => x.id === s.session_id);
      if (!item) {
        sessions.push({
          id: s.session_id,
          title: (s.preview || "").slice(0, 26) || s.session_id,
          ts,
          hasSummary: !!s.has_summary,
        });
        changed = true;
      } else {
        if (ts > (item.ts || 0)) { item.ts = ts; changed = true; }
        if (s.has_summary && !item.hasSummary) { item.hasSummary = true; changed = true; }
      }
    }
    if (changed) { sessions.sort((a, b) => b.ts - a.ts); saveSessionState(); }
    renderSessionList();
  } catch (e) { /* 拉不到就先用本地列表 */ }
}

function newSession() {
  currentSession = "sess-" + Date.now().toString(36);
  saveSessionState();
  renderSessionList();
  renderWelcome();
  closeSidebar();
  msgInput.focus();
}

async function selectSession(id) {
  currentSession = id;
  saveSessionState();
  renderSessionList();
  closeSidebar();
  resetView("");
  empty = false;

  try {
    const res = await authFetch("/memories/sessions/" + encodeURIComponent(id));
    if (res.ok) {
      const msgs = await res.json();
      if (msgs.length) {
        for (const m of msgs) addMsg(m.role === "assistant" ? "assistant" : "user", m.content || "");
        scrollDown();
        return;
      }
    }
  } catch (e) { /* 拉取失败按空会话处理 */ }

  inner.innerHTML = `<div class="side-empty" style="text-align:center;padding:46px 20px">`
    + `这个会话的短期记忆已经不在了（超过 24 小时未活跃，或服务重启过）。<br>`
    + `继续发消息会接着这个会话 ID 开始新的上下文。</div>`;
}

function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("scrim").classList.add("show");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").classList.remove("show");
}

/* ==================== 用户画像 ====================
   画像按"用户"归属、跨会话累积，与会话记忆分工明确：
     会话记忆回答"我们刚才聊了什么"，画像回答"你是谁、习惯怎样"。
   无鉴权部署下没有登录用户，因此本地自动生成一个稳定标识并一直携带。
   画像内容直接显示在侧边栏，避免它变成一个看不见效果的黑盒。 */
function ensureUserId() {
  if (!localUserId) {
    localUserId = "local-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(LS_USER, localUserId);
  }
}

function profileUrl() {
  return "/memories/profile?user_id=" + encodeURIComponent(localUserId);
}

async function loadProfile() {
  const body = document.getElementById("profileBody");
  if (!body) return;
  document.getElementById("profileId").textContent =
    "标识 " + localUserId + " · 本地自动生成，跨会话累积";
  try {
    const res = await authFetch(profileUrl());
    if (!res.ok) { body.innerHTML = `<span class="prof-empty">读取失败</span>`; return; }
    renderProfile(await res.json());
  } catch (e) {
    body.innerHTML = `<span class="prof-empty">读取失败</span>`;
  }
}

function renderProfile(p) {
  const body = document.getElementById("profileBody");
  const prefs = p.preferences || [];
  const counts = p.frequent_terms || {};
  // 只展示达到注入门槛（出现 >= 2 次）的术语，和实际进 prompt 的内容保持一致
  const terms = Object.entries(counts)
    .filter(([, c]) => Number(c) >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 6);

  const prefHtml = prefs.length
    ? prefs.map((x) => `<span class="ptag">${escapeHtml(x)}<i data-unpref="${escapeHtml(x)}" title="移除">×</i></span>`).join("")
    : `<span class="prof-empty">未设置</span>`;
  const termHtml = terms.length
    ? terms.map(([t, c]) => `<span class="ptag plain">${escapeHtml(t)}<i>${c}</i></span>`).join("")
    : `<span class="prof-empty">多聊几轮后自动积累</span>`;

  body.innerHTML =
    `<div class="prof-row"><span class="prof-k">偏好</span><span class="prof-v">${prefHtml}</span></div>`
    + `<div class="prof-row"><span class="prof-k">常提到</span><span class="prof-v">${termHtml}</span></div>`
    + `<div class="prof-row"><span class="prof-k">交互</span><span class="prof-v">${p.interaction_count || 0} 次</span></div>`;
}

async function savePreferences(list) {
  const res = await authFetch(profileUrl(), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ preferences: list }),
  });
  if (!res.ok) return false;
  renderProfile(await res.json());
  return true;
}

async function addPreference() {
  const input = document.getElementById("prefInput");
  const value = input.value.trim();
  if (!value) return;
  try {
    const res = await authFetch(profileUrl());
    const current = res.ok ? ((await res.json()).preferences || []) : [];
    if (current.includes(value)) { input.value = ""; return; }
    if (await savePreferences(current.concat([value]))) {
      input.value = "";
      toast("已加入画像，之后的回答会参考它");
    } else { toast("添加失败"); }
  } catch (e) { toast("添加失败"); }
}

async function removePreference(value) {
  try {
    const res = await authFetch(profileUrl());
    if (!res.ok) return;
    const current = (await res.json()).preferences || [];
    await savePreferences(current.filter((x) => x !== value));
  } catch (e) { /* 忽略 */ }
}

async function clearProfile() {
  try {
    await authFetch(profileUrl(), { method: "DELETE" });
    await loadProfile();
    toast("画像已清除");
  } catch (e) { toast("清除失败"); }
}

function scrollDown() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMsg(role, text, tags) {
  if (empty) { resetView(""); empty = false; }
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = role === "user" ? "我" : "S";
  const body = role === "assistant" ? renderMarkdown(text) : escapeHtml(text).replace(/\n/g, "<br>");
  const meta = tags ? `<div class="meta">${tags.map((t) => `<span class="tag accent">${escapeHtml(String(t))}</span>`).join("")}</div>` : "";
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="msg-body"><div class="tool-line"></div><div class="bubble">${body}</div>${meta}</div>`;
  inner.appendChild(div);
  scrollDown();
  return div;
}

function setMeta(div, tags) {
  const holder = div.querySelector(".msg-body");
  let el = holder.querySelector(".meta");
  if (!el) { el = document.createElement("div"); el.className = "meta"; holder.appendChild(el); }
  el.innerHTML = tags.map((t) => `<span class="tag accent">${escapeHtml(String(t))}</span>`).join("");
}

function addToolChip(div, name, done) {
  const line = div.querySelector(".tool-line");
  let chip = Array.from(line.querySelectorAll(".tool-chip")).find((c) => c.dataset.name === name && !c.classList.contains("done"));
  if (!chip) {
    chip = document.createElement("span");
    chip.className = "tool-chip";
    chip.dataset.name = name;
    chip.textContent = `${name} 调用中`;
    line.appendChild(chip);
  }
  if (done) { chip.classList.add("done"); chip.textContent = `${name} 已完成`; }
}

function renderSources(div, data) {
  const items = [];
  (data.sources || []).forEach((s) => {
    const label = [s.kb, s.filename].filter(Boolean).join(" / ") || "知识库";
    items.push(`<div class="item">${escapeHtml(label)} · 相似度 ${(Number(s.score || 0) * 100).toFixed(0)}%</div>`);
  });
  (data.web_sources || []).forEach((s) => {
    const url = encodeURI(s.url || "#");
    const title = escapeHtml(s.title || s.url || "");
    items.push(`<div class="item"><a href="${url}" target="_blank" rel="noopener">${title}</a></div>`);
  });
  if (!items.length) return;
  const el = document.createElement("div");
  el.className = "sources";
  el.innerHTML = `<div class="sources-title">引用来源</div>${items.join("")}`;
  div.querySelector(".bubble").appendChild(el);
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.id = "typing-indicator";
  div.innerHTML = `<div class="avatar">S</div><div class="msg-body"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  inner.appendChild(div);
  scrollDown();
}
function removeTyping() { const el = document.getElementById("typing-indicator"); if (el) el.remove(); }

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  toaster.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .25s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 250);
  }, 2200);
}

/* ==================== 请求 ==================== */
function resultTags(data) {
  return [`意图 ${data.intent}`, `Agent ${data.agent_used}`, `置信度 ${(data.confidence * 100).toFixed(0)}%`];
}

function buildRequest(sid, msg) {
  const body = { session_id: sid, message: msg };
  if (requestModel) body.model = requestModel;
  body.user_id = localUserId;   // 画像与记忆归属；无鉴权时由本地自动生成，始终携带
  const headers = { "Content-Type": "application/json", "X-Web-Search": webSearchEnabled ? "1" : "0" };
  return { body, headers };
}

async function sendOnce(sid, msg) {
  const { body, headers } = buildRequest(sid, msg);
  const res = await authFetch("/chat", { method: "POST", headers, body: JSON.stringify(body) });
  const data = await res.json();
  removeTyping();
  if (res.ok) {
    const div = addMsg("assistant", data.reply, resultTags(data));
    (data.tool_calls || []).forEach((t) => addToolChip(div, t.name, true));
    renderSources(div, data);
  } else {
    addMsg("assistant", `请求失败：${data.detail || "请稍后重试"}`);
  }
}

/* 流式请求：解析 SSE（meta / token / tool_start / tool_end / done / error） */
async function sendStream(sid, msg) {
  const { body, headers } = buildRequest(sid, msg);
  const res = await authFetch("/chat/stream", { method: "POST", headers, body: JSON.stringify(body) });
  if (!res.ok || !res.body) {
    if (res.status === 401) { removeTyping(); addMsg("assistant", "请先登录"); return true; }
    return false;
  }
  removeTyping();
  const div = addMsg("assistant", "");
  const bubble = div.querySelector(".bubble");
  let text = "";
  let pending = false;
  let finished = false;

  const render = () => {
    pending = false;
    bubble.innerHTML = renderMarkdown(text || "…");
    scrollDown();
  };

  const handle = (type, data) => {
    if (type === "meta") {
      setMeta(div, [`意图 ${data.intent}`, `置信度 ${(data.confidence * 100).toFixed(0)}%`]);
    } else if (type === "token") {
      text += data.content;
      if (!pending) { pending = true; requestAnimationFrame(render); }
    } else if (type === "tool_start") {
      addToolChip(div, data.name, false);
    } else if (type === "tool_end") {
      addToolChip(div, data.name, true);
    } else if (type === "done") {
      finished = true;
      text = data.reply || text;
      render();
      setMeta(div, resultTags(data));
      renderSources(div, data);
    } else if (type === "error") {
      finished = true;
      text += `\n\n生成中断：${data.message}`;
      render();
    }
  };

  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let type = "message";
        let dataLine = "";
        raw.split("\n").forEach((line) => {
          if (line.startsWith("event:")) type = line.slice(6).trim();
          else if (line.startsWith("data:")) dataLine += line.slice(5).trim();
        });
        if (dataLine) { try { handle(type, JSON.parse(dataLine)); } catch (e) { /* 忽略无法解析的事件 */ } }
      }
    }
  } catch (e) {
    text += "\n\n连接中断";
  }
  if (!finished) render();
  return true;
}

async function send() {
  const msg = msgInput.value.trim();
  if (!msg) return;
  if (authEnabled && !authToken) { showLogin(); return; }
  if (!currentSession) newSession();
  const sid = currentSession;
  touchSession(sid, msg.slice(0, 26));          // 首条消息作为会话标题
  if (empty) { resetView(""); empty = false; }
  addMsg("user", msg);
  msgInput.value = "";
  msgInput.style.height = "auto";
  sendBtn.disabled = true;
  sendBtn.textContent = "发送中";
  addTyping();
  try {
    let ok = false;
    try { ok = await sendStream(sid, msg); } catch (e) { ok = false; }
    if (!ok) await sendOnce(sid, msg);
  } catch (e) {
    removeTyping();
    addMsg("assistant", "无法连接到服务器，请确认服务已启动。");
  }
  sendBtn.disabled = false;
  sendBtn.textContent = "发送";
  loadProfile();          // 交互次数与术语可能已更新，刷新侧边栏的画像卡片
}

/* ==================== 事件绑定 ==================== */
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 132) + "px";
});
sendBtn.addEventListener("click", send);
searchToggle.addEventListener("change", () => { webSearchEnabled = searchToggle.checked; });
modelSelect.addEventListener("change", () => switchModel(modelSelect.value));
document.getElementById("btnNewSession").addEventListener("click", newSession);
document.getElementById("sessionList").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { pendingDelete = del.dataset.del; renderSessionList(); return; }

  const confirmBtn = e.target.closest("[data-confirm]");
  if (confirmBtn) { deleteSession(confirmBtn.dataset.confirm); return; }

  if (e.target.closest("[data-cancel]")) { pendingDelete = ""; renderSessionList(); return; }

  const item = e.target.closest(".conv");
  if (item && item.dataset.sid) selectSession(item.dataset.sid);
});
document.getElementById("btnSidebar").addEventListener("click", openSidebar);
document.getElementById("scrim").addEventListener("click", closeSidebar);
document.getElementById("btnProfileClear").addEventListener("click", clearProfile);
document.getElementById("btnPrefAdd").addEventListener("click", addPreference);
document.getElementById("prefInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addPreference(); }
});
document.getElementById("profileBody").addEventListener("click", (e) => {
  const un = e.target.closest("[data-unpref]");
  if (un) removePreference(un.dataset.unpref);
});
document.getElementById("btnLogin").addEventListener("click", login);
document.getElementById("loginPass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });
chatArea.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (chip && chip.dataset.ask) { msgInput.value = chip.dataset.ask; send(); }
});
</script>
